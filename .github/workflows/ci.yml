name: Verificação PAF

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit
      - name: Instalar navegador dos testes
        run: npx playwright install --with-deps chrome
      - name: Validar jornadas administrativas e de campo
        run: |
          PAF_CI_PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")"
          export PAF_ADMIN_PASSWORD="$PAF_CI_PASSWORD"
          export PAF_E2E_ADMIN_PASSWORD="$PAF_CI_PASSWORD"
          npm run test:e2e
      - name: Validar abertura offline do PWA
        run: npm run test:pwa

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Iniciar banco local e aplicar migrations
        run: supabase start
      - name: Reaplicar schema do zero
        run: supabase db reset
      - name: Testar transações do banco
        run: supabase test db
      - name: Encerrar serviços locais
        if: always()
        run: supabase stop --no-backup
